name: Production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome for PDF integration tests
        run: pnpm --filter @resume-tailoring/web exec puppeteer browsers install chrome
      - name: Install Chromium for the E2E smoke test
        run: pnpm --filter @resume-tailoring/web exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Run the Chromium E2E smoke test
        run: pnpm test:e2e

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment:
      name: production
      url: https://resume-studio.bakateba.workers.dev
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-west-3
      STACK_NAME: honest-resume-demo
      ECR_REPOSITORY: honest-resume-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Check deployment settings
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
        run: |
          : "${AWS_DEPLOY_ROLE_ARN:?Set the production AWS_DEPLOY_ROLE_ARN variable}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the production CLOUDFARE_ACCOUNT_ID secret}"
          : "${CLOUDFLARE_API_TOKEN:?Set the production CLOUDFARE_API_TOKEN secret}"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Require the existing application stack
        run: aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: ecr
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push the Lambda image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Update the application stack
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file template.yaml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "ContainerImageUri=$IMAGE_URI"
      - name: Read the deployed origin
        id: origin
        run: |
          # shellcheck disable=SC2016
          origin_url=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`DemoUrl`].OutputValue | [0]' --output text)
          [[ "$origin_url" == https://*.lambda-url.eu-west-3.on.aws/ ]]
          printf 'url=%s\n' "$origin_url" >> "$GITHUB_OUTPUT"
      - name: Deploy the public Worker
        working-directory: infrastructure/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
          ORIGIN_URL: ${{ steps.origin.outputs.url }}
        run: pnpm dlx wrangler@4.142.0 deploy --var "ORIGIN_URL:$ORIGIN_URL"
      - name: Check availability and access protection without calling OpenAI
        env:
          ORIGIN_URL: ${{ steps.origin.outputs.url }}
        run: bash scripts/check-production.sh https://resume-studio.bakateba.workers.dev "$ORIGIN_URL"

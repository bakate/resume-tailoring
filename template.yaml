AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Honest Resume public demo on AWS Lambda

Parameters:
  ApplicationName:
    Type: String
    Default: honest-resume-demo
  ContainerImageUri:
    Type: String
    MinLength: 1
  DemoSessionSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  DemoOriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  DemoPublicHostname:
    Type: String
    MinLength: 1
  OpenAiApiKey:
    Type: String
    NoEcho: true
    MinLength: 1
  TurnstileSecretKey:
    Type: String
    NoEcho: true
    MinLength: 1
  TurnstileSiteKey:
    Type: String
    MinLength: 1
  AlarmEmail:
    Type: String
    Default: ''
    Description: Address notified when an abuse alarm fires; leave empty to keep alarms visible in CloudWatch only

Conditions:
  NotifyAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:
  WebFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
      DockerTag: latest
    Properties:
      FunctionName: !Ref ApplicationName
      PackageType: Image
      ImageUri: !Ref ContainerImageUri
      Architectures:
        - arm64
      MemorySize: 2048
      Timeout: 120
      # One preparation writes at most four Resume Sections at once; ten executions serve two or three Candidates
      # preparing together and cap what a burst can spend.
      ReservedConcurrentExecutions: 10
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          DEMO_ACCESS_MODE: enforced
          DEMO_ORIGIN_SECRET: !Ref DemoOriginSecret
          DEMO_PUBLIC_HOSTNAME: !Ref DemoPublicHostname
          DEMO_SESSION_SECRET: !Ref DemoSessionSecret
          OPENAI_API_KEY: !Ref OpenAiApiKey
          OPENAI_STRUCTURED_MODEL: gpt-6-luna
          OPENAI_STRUCTURED_REASONING_EFFORT: low
          OPENAI_WRITING_MODEL: gpt-6-sol
          OPENAI_WRITING_REASONING_EFFORT: medium
          TURNSTILE_SECRET_KEY: !Ref TurnstileSecretKey
          TURNSTILE_SITE_KEY: !Ref TurnstileSiteKey
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  WebFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApplicationName}
      RetentionInDays: 7

  AbuseAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ApplicationName}-abuse-alarms

  AbuseAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: NotifyAlarmEmail
    Properties:
      TopicArn: !Ref AbuseAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # The edge quotas allow about 30 preparations a day of about 40 model-backed requests each. An hour above this
  # volume means traffic is bypassing them or the Candidate Journey is looping.
  InvocationVolumeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ApplicationName}-invocation-volume
      AlarmDescription: Invocations in one hour exceed what the daily Tailored Resume quotas allow
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref WebFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AbuseAlarmTopic]

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ApplicationName}-function-errors
      AlarmDescription: The function crashed or timed out repeatedly
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WebFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AbuseAlarmTopic]

  ConcurrencyCeilingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ApplicationName}-concurrency-ceiling
      AlarmDescription: Requests were throttled at the reserved concurrency ceiling
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref WebFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AbuseAlarmTopic]

Outputs:
  DemoUrl:
    Description: Public HTTPS URL for the protected demo
    Value: !GetAtt WebFunctionUrl.FunctionUrl
